security:
  oidc:
    enabled: false
    issuer: ${OIDC_ISSUER:}
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
    audience: ${OIDC_AUDIENCE:}
    client-id: ${OIDC_CLIENT_ID:}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: genome-companion-core-api
  datasource:
    url: ${GC_DATABASE_URL:}
    username: ${GC_DATABASE_USERNAME:}
    password: ${GC_DATABASE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

gc:
  consent:
    enabled: false
  workload-tokens:
    enabled: false
  foundation:
    enabled: false
    allowed-origin: ${GC_ALLOWED_ORIGIN:}
    secure-cookies: true
    session-ttl: 30m
    quarantine-root: ${GC_QUARANTINE_ROOT:}
    audit-pepper: ${GC_AUDIT_PEPPER:}
    allowed-document-sha256: ${GC_ALLOWED_DOCUMENT_SHA256:}
