name: genome-companion-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions: {}

concurrency:
  group: genome-companion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: synthetic contract and integration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GC_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      GC_TEST_QUARANTINE_ROOT: /tmp/genome-companion-hostile-document
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Java toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install checksum-verified OpenTofu 1.10.6
        env:
          OPENTOFU_URL: https://github.com/opentofu/opentofu/releases/download/v1.10.6/tofu_1.10.6_linux_amd64.zip
          OPENTOFU_SHA256: 15b7bed76420b50da3e121769c43341df8cd57d751ca14e6dbe9c850124c6dac
        run: |
          curl --fail --location --retry 3 --output /tmp/opentofu-1.10.6.zip "$OPENTOFU_URL"
          echo "$OPENTOFU_SHA256  /tmp/opentofu-1.10.6.zip" | sha256sum --check --strict
          mkdir --parents /tmp/gc-opentofu-1.10.6 /tmp/gc-tofu-plugin-cache
          unzip -q /tmp/opentofu-1.10.6.zip -d /tmp/gc-opentofu-1.10.6
          test "$(/tmp/gc-opentofu-1.10.6/tofu version -json | jq -r .terraform_version)" = "1.10.6"
          echo "/tmp/gc-opentofu-1.10.6" >> "$GITHUB_PATH"
          echo "TF_PLUGIN_CACHE_DIR=/tmp/gc-tofu-plugin-cache" >> "$GITHUB_ENV"
      - name: Prepare checksum-verified ClamAV 1.5.4 engine
        env:
          CLAMAV_DEB_URL: https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.linux.x86_64.deb
          CLAMAV_DEB_SHA256: 28d6efc5b4423e7830c3559339552eb53870a9eac51ac4efb37d60530d329886
        run: |
          curl --fail --location --retry 3 --output /tmp/clamav-1.5.4.deb "$CLAMAV_DEB_URL"
          echo "$CLAMAV_DEB_SHA256  /tmp/clamav-1.5.4.deb" | sha256sum --check --strict
          mkdir --parents /tmp/gc-clamav-1.5.4
          dpkg-deb --extract /tmp/clamav-1.5.4.deb /tmp/gc-clamav-1.5.4
          clamav_lib_path=/tmp/gc-clamav-1.5.4/usr/local/lib64:/tmp/gc-clamav-1.5.4/usr/local/lib
          clamav_bin=/tmp/gc-clamav-1.5.4/usr/local/bin/clamscan
          test "$(LD_LIBRARY_PATH="$clamav_lib_path" "$clamav_bin" --version)" = "ClamAV 1.5.4"
          echo "LD_LIBRARY_PATH=$clamav_lib_path" >> "$GITHUB_ENV"
          echo "CVD_CERTS_DIR=/tmp/gc-clamav-1.5.4/usr/local/etc/certs" >> "$GITHUB_ENV"
          echo "GC_TEST_CLAMSCAN_PATH=$clamav_bin" >> "$GITHUB_ENV"
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate runtime and truthful readiness contracts
        run: |
          pnpm security:runtime-policy
          pnpm security:github-actions-policy
          pnpm auth-security:gate
          pnpm release:readiness:validate
      - name: Validate infrastructure policy and synthetic-only boundaries
        run: |
          tofu fmt -check -recursive infra
          tofu -chdir=infra/modules/organization init -backend=false -lockfile=readonly
          tofu -chdir=infra/modules/organization validate
          tofu -chdir=infra/modules/organization test
          tofu -chdir=infra/modules/synthetic-staging init -backend=false -lockfile=readonly
          tofu -chdir=infra/modules/synthetic-staging validate
          tofu -chdir=infra/modules/synthetic-staging test
          tofu -chdir=infra/live/synthetic-staging init -backend=false -lockfile=readonly
          tofu -chdir=infra/live/synthetic-staging validate
      - name: Test and build both presentation runtimes
        run: |
          pnpm web:test
          pnpm --dir apps/web build
          pnpm research:test
          pnpm research:build
      - name: Resolve JVM build plugins with bounded network retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew help --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Test Spring, document boundary, worker, Flyway, and PostgreSQL lifecycle
        id: jvm-tests
        run: ./gradlew test --no-daemon
      - name: Preserve JVM failure evidence
        if: ${{ failure() && steps.jvm-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-jvm-failure-evidence
          path: "**/build/test-results/test/**"
          if-no-files-found: warn
          retention-days: 7
      # No `if:` on purpose: the parser gate runs on every push and PR after the JVM tests. The
      # MedGemma experiment (pnpm medical-ai:medgemma-experiment) is deliberately absent from CI —
      # it needs a local GPU and the pulled model and is evidence, not a gate.
      - name: Score the native-text parser on the generated synthetic Korean checkup corpus
        run: pnpm medical-ai:native-text-gate
      - name: Install browser used by the bounded lifecycle test
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run browser-to-Spring-to-worker lifecycle
        id: foundation-e2e
        run: pnpm foundation:e2e
      - name: Preserve synthetic browser and viewport evidence
        if: ${{ always() && (steps.foundation-e2e.outcome == 'success' || steps.foundation-e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-browser-evidence
          path: apps/web/test-results
          if-no-files-found: error
          retention-days: 7
      - name: Generate JVM CycloneDX SBOM
        run: ./gradlew :apps:core-api:cyclonedxBom --no-daemon
      - name: Preserve SBOM as a build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: core-api-cyclonedx-sbom
          path: apps/core-api/build/reports/application.cdx.json
          if-no-files-found: error
          retention-days: 14

  sast-javascript:
    name: CodeQL SAST (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  sast-jvm:
    name: CodeQL SAST (Java/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build JVM sources for analysis
        run: >-
          ./gradlew
          :packages:document-boundary:classes
          :apps:document-worker:classes
          :packages:korean-checkup-benchmark:classes
          :apps:core-api:classes
          --no-daemon
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  runtime-images:
    name: runtime image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `trivyignore` is the only accepted-risk channel here: a non-empty value names a file
          # of CVE ids the blocking Critical step below is allowed to pass over, and it is set for
          # the web image alone. `ignore-unfixed` stays `false` for all three images.
          - name: web
            dockerfile: apps/web/Dockerfile
            trivyignore: apps/web/.trivyignore
          - name: core-api
            dockerfile: apps/core-api/Dockerfile
            trivyignore: ""
          - name: document-worker
            dockerfile: apps/document-worker/Dockerfile
            trivyignore: ""
    env:
      IMAGE_REF: genome-companion/${{ matrix.name }}:${{ github.sha }}
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build digest-pinned Linux runtime image
        run: >-
          docker build
          --pull
          --platform linux/amd64
          --label org.opencontainers.image.revision=${GITHUB_SHA}
          --file "${{ matrix.dockerfile }}"
          --tag "${IMAGE_REF}"
          .
      - name: Verify runtime identity and non-root user
        run: |
          runtime_user="$(docker image inspect --format '{{.Config.User}}' "${IMAGE_REF}")"
          case "${runtime_user}" in
            ""|"0"|"root"|"0:0")
              echo "runtime image must declare a non-root user" >&2
              exit 1
              ;;
          esac
          case "${{ matrix.name }}" in
            web)
              docker run --rm --entrypoint node "${IMAGE_REF}" --version
              ;;
            core-api)
              docker run --rm --entrypoint java "${IMAGE_REF}" -version
              ;;
            document-worker)
              test "$(docker run --rm --entrypoint /usr/local/bin/clamscan "${IMAGE_REF}" --version)" = "ClamAV 1.5.4"
              ;;
          esac
      - name: Record immutable build evidence
        id: image-evidence
        run: |
          mkdir --parents runtime-image-evidence
          docker image inspect "${IMAGE_REF}" > "runtime-image-evidence/${{ matrix.name }}-inspect.json"
          docker image inspect --format '{{.Id}}' "${IMAGE_REF}" > "runtime-image-evidence/${{ matrix.name }}-image-id.txt"
      - name: Generate runtime image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, Trivy overridden below
        with:
          version: v0.72.0
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: cyclonedx
          output: runtime-image-evidence/${{ matrix.name }}.cdx.json
      # A Critical finding with no upstream fix is still a Critical finding: `ignore-unfixed: true`
      # let the one class of vulnerability we cannot patch our way out of pass unnoticed, which is
      # backwards -- an unfixed Critical is the one that needs a human decision (rebase the base
      # image, drop the dependency, or record an accepted risk), not the one that needs silence.
      - name: Fail on Critical image vulnerabilities, fixed or not
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, Trivy overridden below
        with:
          version: v0.72.0
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          # Empty for core-api and document-worker; `apps/web/.trivyignore` for web, where four
          # Debian 12 Criticals (perl-base x3, zlib1g) have no fixed version and are accepted
          # in-repo with a review date rather than silenced by flipping `ignore-unfixed`.
          trivyignores: ${{ matrix.trivyignore }}
      # High findings move to a non-blocking report: blocking on every unfixed High in a JRE or Node
      # base image would make the pipeline red for reasons no change in this repository can clear,
      # and a gate that is always red stops being read. The table still prints in the job log.
      - name: Report High image vulnerabilities (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, Trivy overridden below
        with:
          version: v0.72.0
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          scanners: vuln
          severity: HIGH
          ignore-unfixed: false
          exit-code: "0"
          format: table
      - name: Preserve image ID, manifest, and SBOM evidence
        if: ${{ always() && steps.image-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: runtime-image-${{ matrix.name }}-evidence
          path: runtime-image-evidence
          if-no-files-found: error
          retention-days: 14

  image-smoke:
    name: runtime image smoke (core-api + document-worker boot to /healthz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `needs` orders this after the images have been built and scanned; it does not carry the images
    # over, because image layers are not job artifacts. Both images are rebuilt here from the same
    # revision and the same Dockerfiles. The runner is ephemeral and shares no layer cache with the
    # `runtime-images` job, so this is a full cold build of both images — paid for a second time, and
    # budgeted for by this job's 30-minute timeout rather than avoided.
    needs: runtime-images
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build core-api and document-worker images
        run: |
          docker build --pull --platform linux/amd64 --file apps/core-api/Dockerfile --tag gc-smoke/core-api .
          docker build --pull --platform linux/amd64 --file apps/document-worker/Dockerfile --tag gc-smoke/document-worker .
      - name: Boot core-api against the service database and wait for /actuator/health
        run: |
          # gc.foundation.enabled defaults to false, so the context starts with no secrets at all: the
          # three datasource variables below are the whole boot surface, and Flyway migrates V1..V13
          # into the empty service database on the way up.
          docker run --detach --name gc-core --network host \
            --env GC_DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/postgres \
            --env GC_DATABASE_USERNAME=postgres --env GC_DATABASE_PASSWORD= \
            gc-smoke/core-api
          for attempt in $(seq 1 45); do
            body="$(curl --silent --write-out ' HTTP_%{http_code}' http://127.0.0.1:8080/actuator/health || true)"
            case "${body}" in
              *HTTP_200) echo "core-api UP after ${attempt} polls: ${body}"; exit 0 ;;
            esac
            sleep 2
          done
          echo "core-api health never reached 200 within 90s; last body: ${body}"
          docker logs gc-core 2>&1 | tail -n 200
          exit 1
      - name: Boot document-worker against core-api and wait for /healthz
        run: |
          # GC_WORKER_IMAGE_DIGEST is validated as 64 lowercase hex, which the image ID satisfies once
          # the `sha256:` prefix is stripped. Everything else the worker needs -- the clamscan path,
          # the required ClamAV version and the signature directory -- is baked into the image as ENV
          # by its Dockerfile, so the run only supplies what is environment-specific.
          image_id="$(docker image inspect --format '{{.Id}}' gc-smoke/document-worker | sed 's/^sha256://')"
          docker run --detach --name gc-worker --network host \
            --env GC_WORKER_API_BASE_URL=http://127.0.0.1:8080 \
            --env GC_WORKER_CREDENTIAL=smoke-credential-with-at-least-32-chars-000 \
            --env GC_WORKER_ID=ci-smoke-worker \
            --env GC_WORKER_IMAGE_DIGEST="${image_id}" \
            --env GC_WORKER_HEALTH_PORT=8091 \
            gc-smoke/document-worker
          # The health server binds 127.0.0.1 only; --network host is what puts that loopback in the
          # runner's own namespace. A 503 core-unreachable early in the poll is expected and not an
          # error: it means the worker answered before its first successful probe of the core.
          for attempt in $(seq 1 30); do
            body="$(curl --silent --write-out ' HTTP_%{http_code}' http://127.0.0.1:8091/healthz || true)"
            case "${body}" in
              *HTTP_200) echo "worker ready after ${attempt} polls: ${body}"; exit 0 ;;
            esac
            sleep 2
          done
          echo "worker health never reached 200 within 60s; last body: ${body}"
          docker logs gc-worker 2>&1 | tail -n 100
          docker logs gc-core 2>&1 | tail -n 100
          exit 1
      - name: Stop containers
        if: ${{ always() }}
        run: docker rm --force gc-core gc-worker || true

  migration-replay:
    name: Flyway replay V1..V12 + seeded rows + V13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      GC_DATABASE_USERNAME: postgres
      GC_DATABASE_PASSWORD: ""
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build the core-api jar
        run: ./gradlew :apps:core-api:bootJar --no-daemon
      - name: Apply V1..V12 only
        run: java -jar apps/core-api/build/libs/core-api.jar --spring.main.web-application-type=none --spring.main.lifecycle.timeout-per-shutdown-phase=1s --gc.migrate-only=true --spring.flyway.target=12
      - name: Seed representative rows on the V12 schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO gc_subject(subject_id, created_at) VALUES ('synthetic-replay', now());
          INSERT INTO gc_consent_grant(consent_id, subject_id, purpose_code, status, policy_version, granted_at)
            VALUES ('00000000-0000-0000-0000-0000000000c1', 'synthetic-replay', 'DOCUMENT_EXTRACTION', 'ACTIVE', 'v1', now());
          INSERT INTO gc_document(document_id, subject_id, consent_id, status, media_type, expected_length, created_at, expected_sha256, state_version, updated_at)
            VALUES ('00000000-0000-0000-0000-0000000000d1', 'synthetic-replay', '00000000-0000-0000-0000-0000000000c1', 'REVIEW_REQUIRED', 'application/pdf', 128, now(), repeat('a', 64), 3, now());
          INSERT INTO gc_extraction_job(job_id, document_id, subject_id, status, created_at, attempt) VALUES ('00000000-0000-0000-0000-0000000000e1', '00000000-0000-0000-0000-0000000000d1', 'synthetic-replay', 'COMPLETED', now(), 1);
          INSERT INTO gc_candidate(candidate_id, job_id, document_id, subject_id, status, ordinal, label, candidate_value, unit, observed_on, evidence_page, source_text_sha256, created_at, confirmed_at)
            VALUES ('00000000-0000-0000-0000-0000000000a1', '00000000-0000-0000-0000-0000000000e1', '00000000-0000-0000-0000-0000000000d1', 'synthetic-replay', 'CONFIRMED', 1, 'replay-a', '1', 'mg/dL', '2026-07-28', 1, repeat('1', 64), now(), now()),
                   ('00000000-0000-0000-0000-0000000000a2', '00000000-0000-0000-0000-0000000000e1', '00000000-0000-0000-0000-0000000000d1', 'synthetic-replay', 'PENDING', 2, 'replay-b', '2', 'mg/dL', '2026-07-28', 1, repeat('2', 64), now(), NULL);
          INSERT INTO gc_health_record(record_id, candidate_id, document_id, subject_id, label, confirmed_value, unit, observed_on, confirmed_at)
            VALUES ('00000000-0000-0000-0000-0000000000f1', '00000000-0000-0000-0000-0000000000a1', '00000000-0000-0000-0000-0000000000d1', 'synthetic-replay', 'replay-a', '1', 'mg/dL', '2026-07-28', now());
          INSERT INTO gc_health_record_version(version_id, record_id, subject_id, status, value, supersedes_version_id, correction_reason, changed_at)
            VALUES ('00000000-0000-0000-0000-0000000000b1', '00000000-0000-0000-0000-0000000000f1', 'synthetic-replay', 'SUPERSEDED', '1', NULL, NULL, now() - interval '1 minute'),
                   ('00000000-0000-0000-0000-0000000000b2', '00000000-0000-0000-0000-0000000000f1', 'synthetic-replay', 'CURRENT', '3', '00000000-0000-0000-0000-0000000000b1', 'replay correction', now());
          INSERT INTO gc_idempotency(subject_hash, operation, idempotency_key, resource_id, created_at) VALUES (repeat('c', 64), 'CANDIDATE_CONFIRM', 'replay-key-0001', '00000000-0000-0000-0000-0000000000f1', now() - interval '1 hour');
          INSERT INTO gc_audit_event(event_id, subject_hash, actor_session_hash, event_type, resource_type, resource_id, outcome, occurred_at)
            VALUES ('00000000-0000-0000-0000-0000000000ae', repeat('c', 64), NULL, 'CANDIDATE_CONFIRMED', 'RECORD', '00000000-0000-0000-0000-0000000000f1', 'SUCCESS', now());
          SQL
      - name: Apply V13 on the populated schema
        run: java -jar apps/core-api/build/libs/core-api.jar --spring.main.web-application-type=none --spring.main.lifecycle.timeout-per-shutdown-phase=1s --gc.migrate-only=true
      - name: Assert the seeded rows survived and the new rules hold
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- `ELSE 1/0` cannot fail an assertion: PostgreSQL constant-folds `1/0` while planning, so
          -- such a statement raises division_by_zero whether or not the condition held. A PL/pgSQL
          -- block evaluates its conditions at run time and names what broke.
          DO $$ BEGIN
            IF (SELECT COUNT(*) FROM gc_candidate) <> 2 THEN RAISE EXCEPTION 'seeded candidates did not survive V13'; END IF;
            IF (SELECT COUNT(*) FROM gc_health_record_version WHERE status = 'CURRENT') <> 1 THEN RAISE EXCEPTION 'seeded record versions did not survive V13'; END IF;
            -- A scalar subquery over an empty table yields NULL, `NOT NULL` is NULL, and PL/pgSQL
            -- treats a NULL IF condition as false -- so the three conditions below would pass
            -- silently in exactly the regression each one exists to catch (the row vanished). COALESCE
            -- and IS DISTINCT FROM turn "no row" back into a failure. The two COUNT(*) conditions above
            -- need no such guard: an aggregate over an empty table returns 0, never NULL.
            IF NOT COALESCE((SELECT expires_at = created_at + interval '24 hours' FROM gc_idempotency), false) THEN RAISE EXCEPTION 'V13 did not backfill gc_idempotency.expires_at'; END IF;
            IF (SELECT version FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 1) IS DISTINCT FROM '13' THEN RAISE EXCEPTION 'schema is not at V13'; END IF;
            IF NOT COALESCE((SELECT aliases ? '혈압(수축기)' FROM gc_medical_concept WHERE concept_code = 'systolic-blood-pressure'), false) THEN RAISE EXCEPTION 'V13 alias is missing'; END IF;
          END $$;
          UPDATE gc_document SET status = 'TERMINATED_BY_REVOCATION' WHERE document_id = '00000000-0000-0000-0000-0000000000d1';
          DO $$ BEGIN
            BEGIN
              UPDATE gc_audit_event SET outcome = 'DENIED';
              RAISE EXCEPTION 'audit update must have been rejected';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM NOT LIKE '%append-only%' THEN RAISE; END IF;
            END;
          END $$;
          SQL

  supply-chain:
    name: secrets, dependencies, configuration, and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout complete history for secret detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan filesystem dependencies, secrets, configuration, and licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, Trivy overridden below
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignore-policy: scripts/security/trivy-ignore-policy.rego
          exit-code: "1"
          format: table
