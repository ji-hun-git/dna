<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jihun Chae Simulations - an interactive hub of AI agents, games, reinforcement learning, physics, and 3D simulations." />
  <meta property="og:title" content="Jihun Chae | Simulations" />
  <meta property="og:description" content="Interactive models in agent behavior, games, learning, physics, and generative systems." />
  <meta property="og:image" content="https://ji-hun-git.github.io/lab/assets/lab-hero-field.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://ji-hun-git.github.io/lab/assets/lab-hero-field.png" />
  <title>Jihun Chae | Simulations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <link rel="stylesheet" href="lab/lab.css?v=20260731-labplus" />
</head>
<body>
  <div class="lab-shell">
    <header class="lab-nav" aria-label="Site header">
      <a href="index.html" class="brand-link">
        <span class="brand-text">
          <span class="brand-title">Simulations</span>
          <span class="brand-sub">Interactive models in agent behavior, games, learning, and physics</span>
        </span>
      </a>
      <div class="nav-readout">
        <span class="nav-aff">Jihun Chae &middot; KAIST GSCT</span>
      </div>
      <div class="lab-actions">
        <a class="text-link" href="index.html">View CV &rarr;</a>
      </div>
    </header>

    <main>
      <section class="console" id="console">
        <aside class="console-rail" aria-label="Experiment registry">
          <div class="rail-head">
            <p class="eyebrow">Index</p>
            <h2>Catalogue of experiments</h2>
            <div class="rail-stats">
              <span><strong id="metricProjects">0</strong> sims</span>
              <span><strong id="metricRenderers">0</strong> renderers</span>
              <span><strong id="metricLive">0</strong> live</span>
            </div>
            <div class="rail-visual" aria-hidden="true"></div>
            <div class="rail-filter" id="railFilter"></div>
          </div>
          <div class="project-list" id="projectCards"></div>
        </aside>

        <section class="console-stage" aria-label="Simulation stage">
          <div id="viewportMount"></div>
          <div class="detail-grid" id="detailMount"></div>
        </section>

        <aside class="control-panel console-controls" id="controlMount" aria-label="Controls and parameters"></aside>
      </section>
    </main>

    <footer class="footer">
      <span>Jihun Chae &middot; KAIST Graduate School of Culture Technology</span>
      <span>Human-AI Interaction &middot; Game AI &middot; Ludic AI</span>
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script type="module" src="lab/lab.js?v=20260731-labplus"></script>
</body>
</html>
