<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jihun Chae Simulations - an interactive hub of AI agents, games, reinforcement learning, physics, and 3D simulations." />
  <title>Jihun Chae | Simulations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <link rel="stylesheet" href="lab/lab.css?v=20260615-lab8" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="lab-shell">
    <header class="lab-nav" aria-label="Laboratory navigation">
      <a href="index.html" class="brand-link">
        <span class="brand-mark">JC</span>
        <span>Simulations</span>
      </a>
      <div class="lab-actions">
        <a class="solid-button" href="index.html">Back to CV</a>
      </div>
    </header>

    <main>
      <section class="console" id="console">
        <aside class="console-rail" aria-label="Experiment registry">
          <div class="rail-head">
            <p class="eyebrow">Project Registry</p>
            <h2>Choose an experiment slot</h2>
            <div class="rail-stats">
              <span><strong id="metricProjects">0</strong> sims</span>
              <span><strong id="metricRenderers">0</strong> renderers</span>
              <span><strong id="metricLive">0</strong> live</span>
            </div>
            <div class="rail-filter" id="railFilter"></div>
          </div>
          <div class="project-list" id="projectCards"></div>
        </aside>

        <section class="console-stage" aria-label="Simulation stage">
          <div id="viewportMount"></div>
          <div class="detail-grid" id="detailMount"></div>
        </section>

        <aside class="control-panel console-controls" id="controlMount" aria-label="Controls and parameters"></aside>
      </section>
    </main>

    <footer class="footer">
      <span>Jihun Chae Laboratory / Simulation Hub</span>
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script>
    // Ambient grid follows the cursor (mirrors the main site).
    (function () {
      let raf = null;
      window.addEventListener('pointermove', (e) => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          document.body.style.setProperty('--gx', e.clientX + 'px');
          document.body.style.setProperty('--gy', e.clientY + 'px');
          raf = null;
        });
      }, { passive: true });
    })();
  </script>
  <script type="module" src="lab/lab.js?v=20260615-lab8"></script>
</body>
</html>
